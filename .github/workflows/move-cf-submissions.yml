name: Organize Submissions & Update README

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: organize
  cancel-in-progress: false

jobs:
  organize-and-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move root Codeforces files by language
        run: |
          # 1. Handle folders created by CFPusher (e.g., 4/, 71/, 2045 - Problem/)
          for dir in */; do
            dir="${dir%/}"
            [[ "$dir" =~ ^[0-9]+([[:space:]]*-.*)?$ ]] || continue

            mapfile -d '' files < <(find "$dir" -type f -print0)
            declare -A sublang=()

            # pass 1: detect language per subfolder before anything moves
            for f in "${files[@]}"; do
              d=$(dirname "$f")
              case "$f" in
                *.py)   sublang[$d]=python ;;
                *.java) sublang[$d]=java ;;
                *.cpp)  sublang[$d]=cpp ;;
                *.c)    sublang[$d]=c ;;
              esac
            done
            for f in "${files[@]}"; do
              d=$(dirname "$f")
              [ -n "${sublang[$d]:-}" ] && continue
              if [ -f "$d/README.md" ]; then
                if grep -qiE "python|pypy" "$d/README.md"; then sublang[$d]=python
                elif grep -qiw "java" "$d/README.md"; then sublang[$d]=java
                elif grep -qiE "c\+\+|gnu g\+\+" "$d/README.md"; then sublang[$d]=cpp
                fi
              fi
            done

            # pass 2: move
            for f in "${files[@]}"; do
              d=$(dirname "$f")
              lang="${sublang[$d]:-}"
              [ -z "$lang" ] && continue
              rel="${f#"$dir"/}"
              dest="$lang/codeforces/$dir/$(dirname "$rel")"
              mkdir -p "$dest"
              name=$(basename "$f")
              if [ "$name" == "solution.txt" ]; then
                case "$lang" in
                  python) name="solution.py" ;;
                  java)   name="solution.java" ;;
                  cpp)    name="solution.cpp" ;;
                  c)      name="solution.c" ;;
                esac
              fi
              mv -f "$f" "$dest/$name"
            done

            # only remove what is now empty, leftovers stay visible
            find "$dir" -depth -type d -empty -delete
          done

          # 2. Handle flat files pushed directly to root
          for file in *; do
            if [ -f "$file" ] && [[ "$file" =~ ^[0-9]+.* ]]; then
              case "$file" in
                *.py)   mkdir -p python/codeforces && mv -f "$file" python/codeforces/ ;;
                *.java) mkdir -p java/codeforces   && mv -f "$file" java/codeforces/ ;;
                *.cpp)  mkdir -p cpp/codeforces    && mv -f "$file" cpp/codeforces/ ;;
                *.c)    mkdir -p c/codeforces      && mv -f "$file" c/codeforces/ ;;
              esac
            fi
          done

      - name: Sort Codewars folders by language
        run: |
          declare -A map=( [java]=java [cpp]=cpp [c]=c [cs]=csharp [js]=javascript )
          plat=codewars
          [ -d "python/$plat" ] || exit 0
          find "python/$plat" -type f -print0 | while IFS= read -r -d '' f; do
            ext="${f##*.}"
            lang="${map[$ext]:-}"
            [ -z "$lang" ] && continue

            d=$(dirname "$f")
            rel="${d#python/$plat}"
            rel="${rel#/}"
            dest="$lang/$plat/$rel"
            mkdir -p "$dest"

            mv -f "$f" "$dest/"
            if [ "$d" != "python/$plat" ] && [ -f "$d/README.md" ]; then
              mv -f "$d/README.md" "$dest/"
            fi
            rmdir "$d" 2>/dev/null || true
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update README stats
        run: python .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: organize submissions and update README [skip ci]"
            git push
          fi
