name: Organize Submissions & Update README

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  organize-and-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move root Codeforces files by language
        run: |
          # 1. Handle folders created by CFPusher (e.g., 4/, 71/, 2045 - Problem/)
          for dir in */; do
            dir="${dir%/}"
            if [[ "$dir" =~ ^[0-9]+([[:space:]]*-.*)?$ ]] && [ -d "$dir" ]; then
              find "$dir" -type f | while read -r filepath; do
                relpath="${filepath#"$dir"/}"
                sub_dir=$(dirname "$filepath")
                readme="$sub_dir/README.md"

                # Detect language from file extension OR CFPusher's README.md
                lang=""
                if [[ "$filepath" == *.py ]]; then
                  lang="python"
                elif [[ "$filepath" == *.java ]]; then
                  lang="java"
                elif [ -f "$readme" ]; then
                  if grep -qiE "python|pypy" "$readme"; then
                    lang="python"
                  elif grep -qi "java" "$readme"; then
                    lang="java"
                  fi
                fi

                if [ -n "$lang" ]; then
                  dest_dir="$lang/codeforces/$dir/$(dirname "$relpath")"
                  mkdir -p "$dest_dir"
                  filename=$(basename "$filepath")

                  # Rename solution.txt to solution.py / solution.java for syntax highlighting
                  if [ "$filename" == "solution.txt" ]; then
                    [ "$lang" == "python" ] && filename="solution.py"
                    [ "$lang" == "java" ] && filename="solution.java"
                  fi

                  mv -f "$filepath" "$dest_dir/$filename"
                fi
              done
              rm -rf "$dir"
            fi
          done

          # 2. Handle flat files pushed directly to root
          for file in *; do
            if [ -f "$file" ] && [[ "$file" =~ ^[0-9]+.* ]]; then
              if [[ "$file" == *.py ]]; then
                mkdir -p python/codeforces
                mv -f "$file" python/codeforces/
              elif [[ "$file" == *.java ]]; then
                mkdir -p java/codeforces
                mv -f "$file" java/codeforces/
              fi
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update README stats
        run: python .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: organize submissions and update README [skip ci]"
            git push
          fi
