name: Organize Submissions & Update README

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write

jobs:
  organize-and-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move root Codeforces files by language
        run: |
          # 1. Handle folders created by CFPusher (e.g., 800/, 2045/, 2045 - Problem/)
          for dir in */; do
            dir="${dir%/}"
            if [[ "$dir" =~ ^[0-9]+([[:space:]]*-.*)?$ ]] && [ -d "$dir" ]; then
              find "$dir" -type f | while read -r filepath; do
                relpath="${filepath#"$dir"/}"
                if [[ "$filepath" == *.py ]]; then
                  mkdir -p "python/codeforces/$dir/$(dirname "$relpath")"
                  mv -f "$filepath" "python/codeforces/$dir/$relpath"
                elif [[ "$filepath" == *.java ]]; then
                  mkdir -p "java/codeforces/$dir/$(dirname "$relpath")"
                  mv -f "$filepath" "java/codeforces/$dir/$relpath"
                fi
              done
              rmdir --ignore-fail-on-non-empty -p "$dir" 2>/dev/null || rm -rf "$dir"
            fi
          done

          # 2. Handle flat files pushed directly to root
          for file in *; do
            if [ -f "$file" ] && [[ "$file" =~ ^[0-9]+.* ]]; then
              if [[ "$file" == *.py ]]; then
                mkdir -p python/codeforces
                mv -f "$file" python/codeforces/
              elif [[ "$file" == *.java ]]; then
                mkdir -p java/codeforces
                mv -f "$file" java/codeforces/
              fi
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update README stats
        run: python .github/scripts/update_readme.py

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: organize submissions and update README [skip ci]"
            git push
          fi
